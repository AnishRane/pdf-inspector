[package]
name = "pdf-inspector-napi"
version = "1.14.4"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pdf-inspector = { path = ".." }
napi = { version = "3.0.0", features = ["serde-json"] }
napi-derive = "3.0.0"

[features]
# Test-only entry point that panics on purpose (see test-panic.mjs). Never
# enabled for release builds.
panic-probe = []

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "debuginfo"
